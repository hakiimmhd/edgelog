<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edgelog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edgelog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)">
<meta name="description" content="Edgelog, ton journal de trading : trades, captures, calendrier, journal quotidien et playbook.">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: barre latérale fixe + zone de travail; tuiles de stats, graphiques, tableaux denses. */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel-2:#eceff6; --line:#dbe0ea;
  --text:#121725; --muted:#5e677c; --accent:#3354e0; --accent-soft:#e3e9ff;
  --win:#0b9467; --win-soft:#dcf5ea; --loss:#d93a44; --loss-soft:#fde4e5; --warn:#c77c06;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e15; --panel:#121722; --panel-2:#192031; --line:#242c3e;
    --text:#e6e9f1; --muted:#8a93a9; --accent:#7390ff; --accent-soft:#1d2645;
    --win:#25c48c; --win-soft:#10291f; --loss:#ff5f68; --loss-soft:#331418; --warn:#f0a43a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e15; --panel:#121722; --panel-2:#192031; --line:#242c3e;
  --text:#e6e9f1; --muted:#8a93a9; --accent:#7390ff; --accent-soft:#1d2645;
  --win:#25c48c; --win-soft:#10291f; --loss:#ff5f68; --loss-soft:#331418; --warn:#f0a43a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:224px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:16px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.side .grow{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;padding:8px 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.ok{background:var(--win)} .dot.bad{background:var(--loss)}
main{overflow:auto;padding:22px 26px 60px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--loss)} .btn.danger.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2,.card h3{margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card-head h2,.card-head h3{margin:0}
.muted{color:var(--muted)}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.kpi .val{font-family:var(--f-mono);font-size:20px;white-space:nowrap;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.bar2{height:6px;border-radius:4px;background:var(--loss-soft);overflow:hidden;margin-top:8px;display:flex}
.bar2 i{background:var(--win);display:block}
.pos{color:var(--win)} .neg{color:var(--loss)}
.g-main{grid-template-columns:2fr 1fr} .g-2{grid-template-columns:1fr 1fr} .g-3{grid-template-columns:repeat(3,1fr)}
.chart-box{position:relative;height:250px}
.chart-box.sm{height:200px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
td.r,th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.chip.long{background:var(--win-soft);color:var(--win);border-color:transparent}
.chip.short{background:var(--loss-soft);color:var(--loss);border-color:transparent}
.chip.mis{background:var(--loss-soft);color:var(--loss);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ty{font-weight:600;border-color:transparent}
.chip.ty-demo{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--text)}
.chip.ty-challenge{background:var(--accent-soft);color:var(--accent)}
.chip.ty-express{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.ty-funded{background:var(--win-soft);color:var(--win)}
tr.ty-row{cursor:pointer} tr.ty-row:hover td{background:var(--panel-2)} tr.ty-row.on td{background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.toggle-chip{cursor:pointer;user-select:none}
.toggle-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle-chip.on.misc{background:var(--loss);border-color:var(--loss)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.filters select,.filters input{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f > span{display:flex;justify-content:space-between}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.span2{grid-column:span 2} .span4{grid-column:1/-1}
.sec-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:var(--r);margin-bottom:14px}
.banner.warn{background:var(--loss-soft)}
.thumb-row{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:132px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--text)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;cursor:pointer;font-size:19px;line-height:1;color:var(--line)}
.stars button.on{color:var(--warn)}
.stars.ro span{font-size:14px;color:var(--line)} .stars.ro span.on{color:var(--warn)}
.overlay{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(920px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.preview{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--panel-2);padding:10px 14px;border-radius:8px;margin-top:10px}
.preview .num{font-size:18px;font-weight:600}
.drawer-wrap{position:fixed;inset:0;z-index:15;background:rgba(8,10,16,.4);display:flex;justify-content:flex-end}
.drawer{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:20px 22px 40px}
.big-pnl{font-family:var(--f-mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--panel);padding:9px 12px}
.facts small{display:block;color:var(--muted);font-size:11.5px}
.facts b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.shots{display:grid;gap:10px}
.shots img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.notes{white-space:pre-wrap}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:none;align-items:center;justify-content:center}
#lightbox.on{display:flex}
#lightbox img{max-width:94vw;max-height:88vh;border-radius:6px}
#lightbox button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;width:42px;height:42px;font-size:22px;cursor:pointer}
#lightbox .lb-x{top:16px;right:16px} #lightbox .lb-p{left:16px;top:50%} #lightbox .lb-n{right:16px;top:50%}
#lightbox .lb-c{position:absolute;bottom:14px;color:#ccc;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
/* calendrier */
.cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cal-step{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}.cal-step .btn{flex:none}
.cal-nav select{width:auto;min-width:0;flex:1 1 auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;text-transform:capitalize}
.accdots{display:flex;gap:3px;flex-wrap:wrap}.accdots i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.acc-legend{display:flex;flex-direction:column}
.acc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.acc-sw{width:22px;height:22px;border-radius:6px;position:relative;cursor:pointer;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.acc-sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.acc-name{background:none;border:0;color:var(--text);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;text-align:left}
.acc-name:hover{text-decoration:underline}
.acc-dates{font-size:12.5px;flex:1;min-width:180px}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mcard:hover{border-color:var(--muted)}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mtop b{text-transform:capitalize}.mtop .num{font-family:var(--f-mono);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mgrid span{font-size:10px;text-align:center;padding:4px 0;border-radius:4px;color:var(--muted)}
.mgrid .mh{font-weight:600}
.mgrid .md.win{background:var(--win-soft);color:var(--win);font-weight:600}
.mgrid .md.loss{background:var(--loss-soft);color:var(--loss);font-weight:600}
.mgrid .md.flat{background:var(--panel-2);color:var(--text)}
.macc{display:flex;flex-wrap:wrap;gap:4px}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--panel-2);border-radius:99px;padding:2px 8px 2px 5px}
.mchip i{width:9px;height:9px;border-radius:50%;display:block}
.mfoot{font-size:11.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.05fr;gap:6px}
.cal .hd{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:0 4px}
.cday{min-height:92px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.cday:hover{border-color:var(--muted)}
.cday.out{opacity:.35}
.cday.win{background:var(--win-soft);border-color:color-mix(in srgb,var(--win) 35%,transparent)}
.cday.loss{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 35%,transparent)}
.cday.today .dn{background:var(--accent);color:#fff;border-radius:5px;padding:0 5px}
.cday .dn{font-size:12px;color:var(--muted);font-weight:600;align-self:flex-start}
.cday .p{font-family:var(--f-mono);font-weight:600;font-size:15px;margin-top:auto}
.cday .m{font-size:11.5px;color:var(--muted)}
.cday .ic{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.cweek{min-height:92px;border-radius:8px;background:var(--panel-2);padding:7px 9px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cweek small{color:var(--muted);font-size:11.5px}
.cweek b{font-family:var(--f-mono)}
/* journal */
.j-layout{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.j-list{display:flex;flex-direction:column;gap:4px;max-height:75vh;overflow:auto}
.j-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.j-item:hover{background:var(--panel-2)}
.j-item.on{background:var(--accent-soft);border-color:var(--line)}
.j-item small{color:var(--muted);display:block;font-size:11.5px}
/* playbook */
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pb{display:flex;flex-direction:column;gap:10px}
.pb .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pb .stats div{background:var(--panel-2);border-radius:8px;padding:7px 9px}
.pb .stats small{display:block;color:var(--muted);font-size:11px}
.pb .stats b{font-family:var(--f-mono)}
.pb ul{margin:0;padding-left:18px;color:var(--muted)}
.pb-img{width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.empty{padding:30px;text-align:center;color:var(--muted)}
.score-ring{font-family:var(--f-mono);font-size:30px;font-weight:600}
@media (max-width:1100px){.g-main,.g-3{grid-template-columns:1fr 1fr}.g-main>.span-full{grid-column:1/-1}}
.sh{display:none}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}
#gate.on{display:flex}
.gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-size:26px}
.gate-card p{margin:0}
.err{color:var(--loss);font-size:13px;min-height:0}
.ok{color:var(--win);font-size:13px}
.app{padding-top:env(safe-area-inset-top)}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:block;height:auto;padding-top:0}
  main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));overflow:visible}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:12;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow:visible}
  .brand,.side .grow,.status{display:none}
  .nav{display:flex;width:100%;justify-content:space-around;gap:0}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:5px 4px;min-width:0}
  .lg{display:none} .sh{display:inline}
  #side-new{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;justify-content:center;font-size:28px;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  input,select,textarea{font-size:16px!important}
  .page-head .btn.primary[data-act="new-trade"]{display:none}
  .g-main,.g-2,.g-3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr 1fr}
  .j-layout{grid-template-columns:1fr}
  .j-list{max-height:220px}
  .cal{grid-template-columns:repeat(7,1fr);gap:3px} .cal .wk,.cal .hd.wk{display:none}
  .cday{min-height:58px;padding:4px} .cday .m,.cday .ic{display:none} .accdots i{width:7px;height:7px} .cday .p{font-size:10.5px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100%;border:0;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .drawer{padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
  .kpis{grid-template-columns:1fr 1fr}
  .filters select,.filters input[type=search]{flex:1 1 140px}

<script>
"use strict";
/* ============ utilitaires ============ */
const $ = (s, r=document) => r.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoD = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const nf2 = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});

function money(v, sign=true){ if(!isFinite(v)) return "—"; const s = v>0 && sign ? "+" : v<0 ? "−" : ""; return s + nf2.format(Math.abs(v)) + " $"; }
function moneyK(v){ if(!isFinite(v)) return "—"; const a=Math.abs(v); const s=v>0?"+":v<0?"−":""; return s + (a>=10000? nf0.format(a/1000)+" k$" : nf0.format(a)+" $"); }

const cls = v => v>0 ? "pos" : v<0 ? "neg" : "";
const MC = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate = s => { const d=parseD(s); return d.getDate()+" "+MC[d.getMonth()]+" "+d.getFullYear(); };

/* ============ réglages par défaut ============ */
const DEFAULT_SETTINGS = {
  instruments: [
    {sym:"ES", name:"E-mini S&P 500", pv:50, fee:4.5},

const ACCT_TYPES = ["Démo","Challenge","Express","Funded"];
function guessType(name){ const n = String(name||""); if (/^d[ée]mo|prac|practice/i.test(n)) return "Démo"; if (/express/i.test(n)) return "Express"; if (/challenge|combine|ktc|[ée]valuation/i.test(n)) return "Challenge"; if (/funded|live/i.test(n)) return "Funded"; return ""; }
const typeOf = t => t.accountType || guessType(t.account);
const tyCls = ty => ({"Démo":"ty-demo","Challenge":"ty-challenge","Express":"ty-express","Funded":"ty-funded"})[ty] || "";
const tyChip = ty => ty ? `<span class="chip ty ${tyCls(ty)}">${esc(ty)}</span>` : "";

/* ============ état ============ */
const S = {
  uid: null, email: "", rec: {}, outbox: [], syncErr: null, channel: null,
  trades: [], setups: [], days: {}, settings: clone(DEFAULT_SETTINGS),
  view: "dashboard",
  filter: { period: "all", account: "", instrument: "", type: "" },
  tfilter: { q:"", setup:"", result:"", from:"", to:"" },
  calMonth: (()=>{ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
  jDate: todayISO(),
  drawer: null,             // id du trade ouvert
  dropTarget: null,         // fonction recevant des fichiers collés/déposés
  pendingRender: false
};
let charts = [];

/* ============ calculs ============ */
function instr(sym){ return S.settings.instruments.find(i => i.sym === sym); }
function calc(t){
  const ins = instr(t.instrument); const pv = ins ? Number(ins.pv) : 1;
  const dir = t.side === "short" ? -1 : 1;
  const q = num(t.qty) || 0;
  const pts = (num(t.exit) - num(t.entry)) * dir;
  const gross = isFinite(pts) ? pts * pv * q : NaN;
  const fees = num(t.fees) || 0;
  let net = isFinite(gross) ? gross - fees : NaN;
  const manual = t.pnlManual !== null && t.pnlManual !== undefined && t.pnlManual !== "" && isFinite(Number(t.pnlManual));
  if (manual) net = Number(t.pnlManual);
  const risk = isFinite(num(t.stop)) && isFinite(num(t.entry)) ? Math.abs(num(t.entry) - num(t.stop)) * pv * q : 0;
  const r = risk > 0 && isFinite(net) ? net / risk : null;
  let dur = null;
  if (t.entryTime && t.exitTime) { const [a,b]=t.entryTime.split(":").map(Number), [c,d]=t.exitTime.split(":").map(Number); dur = (c*60+d)-(a*60+b); if (dur<0) dur += 1440; }
  return { pts, gross, fees, net: isFinite(net)?net:0, r, risk, dur, manual, pv };
}
function C(t){ if(!t._c || t._cv !== S.settingsVer) { Object.defineProperty(t,"_c",{value:calc(t),writable:true,configurable:true,enumerable:false}); Object.defineProperty(t,"_cv",{value:S.settingsVer,writable:true,configurable:true,enumerable:false}); } return t._c; }
S.settingsVer = 0;

function stats(list){
  const s = { n:list.length, wins:0, losses:0, be:0, gw:0, gl:0, net:0, rSum:0, rN:0, plan:0, planN:0, fees:0 };
  const byDay = {};
  const sorted = [...list].sort(sortTrades);
  let cum=0, peak=0, dd=0;
  for (const t of sorted) {
    const c = C(t);
    s.net += c.net; s.fees += c.manual?0:c.fees;
    if (c.net > 0) { s.wins++; s.gw += c.net; } else if (c.net < 0) { s.losses++; s.gl += c.net; } else s.be++;
    if (c.r != null) { s.rSum += c.r; s.rN++; }
    if (t.followedPlan === true || t.followedPlan === false) { s.planN++; if (t.followedPlan) s.plan++; }
    const d = byDay[t.date] || (byDay[t.date] = { date:t.date, pnl:0, n:0, w:0, l:0 });
    d.pnl += c.net; d.n++; if (c.net>0) d.w++; else if (c.net<0) d.l++;
    cum += c.net; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum);
  }
  s.winRate = (s.wins + s.losses) ? s.wins / (s.wins + s.losses) : NaN;
  s.pf = s.gl ? s.gw / Math.abs(s.gl) : (s.gw ? Infinity : NaN);
  s.avgW = s.wins ? s.gw / s.wins : 0;
  s.avgL = s.losses ? s.gl / s.losses : 0;
  s.ratio = s.avgL ? s.avgW / Math.abs(s.avgL) : NaN;
  s.exp = s.n ? s.net / s.n : NaN;
  s.avgR = s.rN ? s.rSum / s.rN : NaN;
  s.maxDD = dd;
  s.days = Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date));
  s.greenDays = s.days.filter(d=>d.pnl>0).length;
  s.dayWin = s.days.length ? s.greenDays / s.days.length : NaN;
  s.best = s.days.reduce((m,d)=>Math.max(m,d.pnl), -Infinity);
  s.worst = s.days.reduce((m,d)=>Math.min(m,d.pnl), Infinity);
  s.discipline = s.planN ? s.plan / s.planN : NaN;
  return s;
}
function sortTrades(a,b){ return (a.date+(a.entryTime||"")).localeCompare(b.date+(b.entryTime||"")); }
function score(s){
  const clamp = v => Math.max(0, Math.min(100, isFinite(v) ? v : 0));
  const parts = {
    "Win %": clamp(s.winRate / 0.6 * 100),
    "Profit factor": clamp((s.pf===Infinity?3:s.pf) / 2.5 * 100),
    "Gain/Perte moy.": clamp(s.ratio / 2 * 100),
    "Discipline": clamp(s.discipline * 100),
    "Régularité": clamp(s.dayWin / 0.7 * 100),
    "Drawdown": clamp(s.gw ? (1 - s.maxDD / s.gw) * 100 : 0)
  };
  const vals = Object.values(parts);
  return { parts, total: s.n ? vals.reduce((a,b)=>a+b,0) / vals.length : 0 };
}

/* ============ données d'exemple ============ */
const DEMO = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const setups = [
    { id:"demo-orb", name:"ORB 5 min", description:"Cassure du range des 5 premières minutes après l'ouverture US (15:30 Bruxelles).", rules:["Range clair des 5 premières minutes","Volume au-dessus de la moyenne","Stop sous le range, objectif 2R"], images:[] },
    { id:"demo-vwap", name:"Pullback VWAP", description:"Retour sur la VWAP dans une tendance établie.", rules:["Tendance claire sur 15 min","Rejet visible sur la VWAP","Pas d'annonce dans les 15 min"], images:[] },
    { id:"demo-news", name:"Réaction CPI", description:"Trade de la deuxième impulsion après la publication du CPI (14:30 Bruxelles).", rules:["Attendre la première bougie de 1 min","Entrée sur retracement de 50 %","Taille réduite de moitié"], images:[] }
  ];
  const trades = [];
  const now = new Date();
  for (let i = 34; i >= 1; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const gold = rnd() < 0.35;
      const sym = gold ? (rnd()<0.5?"GC":"MGC") : (rnd()<0.55?"MES":"ES");
      const base = gold ? 4050 + rnd()*120 : 6780 + rnd()*160;
      const tick = gold ? 0.1 : 0.25;
      const side = rnd() < 0.55 ? "long" : "short";
      const stopPts = gold ? 3 + Math.round(rnd()*4) : 3 + Math.round(rnd()*3);
      const win = rnd() < 0.56;
      const move = win ? stopPts * (0.8 + rnd()*1.6) : -stopPts * (0.5 + rnd()*0.55);
      const round = v => Math.round(v / tick) * tick;
      const entry = round(base), exit = round(entry + (side==="long"?1:-1) * move);
      const qty = sym==="MES"||sym==="MGC" ? 2 + Math.floor(rnd()*4) : 1;
      const h = 15 + Math.floor(rnd()*2), m = 30 + Math.floor(rnd()*28);
      const setup = setups[Math.floor(rnd()*3)];
      const mist = !win && rnd() < 0.55 ? [DEFAULT_SETTINGS.mistakes[Math.floor(rnd()*6)]] : [];
      const fee = { ES:4.5, MES:1.5, GC:4.8, MGC:1.8 }[sym] * qty;
      trades.push({
        id:"demo"+trades.length, demo:true, date:isoD(d),
        entryTime: pad(h)+":"+pad(m), exitTime: pad(h)+":"+pad(Math.min(59, m + 2 + Math.floor(rnd()*20))),
        instrument:sym, side, entry, exit, qty, stop: round(entry - (side==="long"?1:-1)*stopPts),
        target: round(entry + (side==="long"?1:-1)*stopPts*2), fees: Math.round(fee*100)/100, pnlManual:null,
        account:"Topstep 50K", setup: setup.id, mistakes: mist,
        tags: setup.id==="demo-news" ? ["CPI"] : [rnd()<0.5?"Ouverture US":"Tendance"],
        emotion: DEFAULT_SETTINGS.emotions[Math.floor(rnd()*5)], rating: win ? 3 + Math.floor(rnd()*3) : 1 + Math.floor(rnd()*3),
        followedPlan: mist.length ? false : true,
        notes: win ? "Entrée propre sur le niveau, sortie à l'objectif." : "Entrée sans confirmation, j'aurais dû attendre la clôture de la bougie.",
        images: []
      });
    }
  }
  return { trades, setups, imagesMade:false };
})();
function demoChart(t){
  const c = document.createElement("canvas"); c.width = 960; c.height = 540;
  const g = c.getContext("2d");
  let seed = t.id.length * 97 + t.date.charCodeAt(9) * 13; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = "#0f131c"; g.fillRect(0,0,960,540);
  g.strokeStyle = "#1c2230"; g.lineWidth = 1;
  for (let y=40;y<540;y+=60){ g.beginPath(); g.moveTo(0,y); g.lineTo(960,y); g.stroke(); }
  let p = 270; const pts=[];
  const win = C(t).net > 0, up = (t.side==="long") === win;
  for (let i=0;i<60;i++){ const drift = i>30 ? (up?-3.2:3.2) : (rnd()-.5)*2; const o=p; p += drift + (rnd()-.5)*16; const h=Math.min(o,p)-rnd()*12, l=Math.max(o,p)+rnd()*12; pts.push([o,p,h,l]); }
  pts.forEach(([o,cl,h,l],i)=>{ const x=20+i*15.5; g.strokeStyle=g.fillStyle = cl<o ? "#25c48c" : "#ff5f68"; g.beginPath(); g.moveTo(x+5,h); g.lineTo(x+5,l); g.stroke(); g.fillRect(x, Math.min(o,cl), 10, Math.max(2,Math.abs(cl-o))); });
  const ey = pts[30][1], xy = pts[52][1];
  g.setLineDash([6,5]); g.lineWidth=2;
  g.strokeStyle="#7390ff"; g.beginPath(); g.moveTo(480,ey); g.lineTo(960,ey); g.stroke();
  g.strokeStyle= win?"#25c48c":"#ff5f68"; g.beginPath(); g.moveTo(830,xy); g.lineTo(960,xy); g.stroke();
  g.setLineDash([]); g.font="600 18px monospace"; g.fillStyle="#e6e9f1";
  g.fillText(t.instrument+" · 1 min · "+(t.side==="long"?"Long":"Short")+" · exemple", 22, 30);
  return c.toDataURL("image/jpeg", .82);
}
function ensureDemoImages(){
  if (DEMO.imagesMade) return; DEMO.imagesMade = true;
  DEMO.trades.forEach((t,i)=>{ if (i%3===0) t.images=[{id:null,url:demoChart(t)}]; });
}

/* ============ accès données (Supabase + cache hors-ligne) ============ */
const isDemo = () => S.trades.length === 0;
const allTrades = () => isDemo() ? DEMO.trades : S.trades;
const allSetups = () => (S.setups.length || !isDemo()) ? S.setups : DEMO.setups;
const setupName = id => (allSetups().find(s=>s.id===id)||{}).name || "";
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} }
};
let SB = null;
const PIX = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
S.signed = LS.get("tj-signed", {}); S.localUrl = {};
const signQ = new Set(); let signT = null;
function srcOf(im){
  if (!im) return PIX;
  if (im.url) return im.url;
  if (S.localUrl[im.path]) return S.localUrl[im.path];
  const c = S.signed[im.path];
  if (c && c.exp > Date.now() + 3600e3) return c.u;
  signQ.add(im.path); clearTimeout(signT); signT = setTimeout(signNow, 30);
  return PIX;
}
function srcAttr(im){ return `src="${esc(srcOf(im))}"` + (im && im.path ? ` data-path="${esc(im.path)}"` : ""); }
const imgSrc = srcOf;
async function signNow(){
  const paths = [...signQ]; signQ.clear();
  if (!paths.length || !SB || !navigator.onLine) return;
  const { data, error } = await SB.storage.from("captures").createSignedUrls(paths, 7*86400);
  if (error || !data) return;
  const exp = Date.now() + 7*86400e3 - 60e3;
  data.forEach(d => { if (d.signedUrl && d.path) S.signed[d.path] = { u: d.signedUrl, exp }; });
  for (const k in S.signed) if (S.signed[k].exp < Date.now()) delete S.signed[k];
  LS.set("tj-signed", S.signed);
  $$("img[data-path]").forEach(img => { if (S.localUrl[img.dataset.path]) return; const c = S.signed[img.dataset.path]; if (c && img.getAttribute("src") !== c.u) img.src = c.u; });
}

function setStatus(kind, txt){ const d=$("#st-dot"); if (!d) return; d.className="dot"+(kind==="ok"?" ok":kind==="bad"?" bad":""); $("#st-txt").textContent=txt; }
function setSync(){
  const n = S.outbox.length;
  if (!navigator.onLine) setStatus("bad", n ? `Hors ligne · ${n} modif. en attente` : "Hors ligne");
  else if (n) setStatus("", `${n} modif. à envoyer…`);
  else if (S.syncErr) setStatus("bad", "Erreur de synchro, nouvel essai bientôt");
  else setStatus("ok", "Synchronisé");
}
function rebuild(){
  const tr = [], se = [], days = {}; let st = null;
  for (const [id, r] of Object.entries(S.rec)) {
    if (r.kind === "trade") tr.push({ ...r.data, id });
    else if (r.kind === "setup") se.push({ ...r.data, id });
    else if (r.kind === "day") days[id] = { ...r.data, date: id };
    else if (r.kind === "settings") st = r.data;
  }
  S.trades = tr; S.setups = se.sort((a,b) => (a.name||"").localeCompare(b.name||"")); S.days = days;
  S.settings = st ? { ...clone(DEFAULT_SETTINGS), ...st } : clone(DEFAULT_SETTINGS);
  S.settingsVer++;
}
function persist(){ LS.set("tj-cache-"+S.uid, S.rec); LS.set("tj-outbox-"+S.uid, S.outbox); }
function put(kind, id, data){
  const now = new Date().toISOString();
  S.rec[id] = { kind, data, updated_at: now };
  S.outbox = S.outbox.filter(o => o.id !== id);
  S.outbox.push({ op:"upsert", id, kind, data, updated_at: now });
  afterWrite();
}
function remove(id){
  delete S.rec[id];
  S.outbox = S.outbox.filter(o => o.id !== id);
  S.outbox.push({ op:"delete", id });
  afterWrite();
}
function putMany(items){
  const now = new Date().toISOString();
  const ids = new Set(items.map(x => x.id));
  S.outbox = S.outbox.filter(o => !ids.has(o.id));
  for (const { kind, id, data } of items) { S.rec[id] = { kind, data, updated_at: now }; S.outbox.push({ op:"upsert", id, kind, data, updated_at: now }); }
  afterWrite();
}
function afterWrite(){ rebuild(); persist(); dataChanged(); flush(); }
let flushing = false;
async function flush(){
  if (flushing || !SB || !S.uid) return;
  if (!S.outbox.length || !navigator.onLine) { setSync(); return; }
  flushing = true; setSync();
  try {
    while (S.outbox.length) {
      const o = S.outbox[0]; let res;
      if (o.op === "upsert") {
        const batch = []; for (const x of S.outbox) { if (x.op !== "upsert" || batch.length >= 150) break; batch.push(x); }
        res = await SB.from("records").upsert(batch.map(x => ({ user_id:S.uid, id:x.id, kind:x.kind, data:x.data, updated_at:x.updated_at })), { onConflict:"user_id,id" });
        if (res.error) throw res.error;
        batch.forEach(x => { const i = S.outbox.indexOf(x); if (i >= 0) S.outbox.splice(i, 1); });
      } else {
        res = await SB.from("records").delete().eq("user_id", S.uid).eq("id", o.id);
        if (res.error) throw res.error;
        const i = S.outbox.indexOf(o); if (i >= 0) S.outbox.splice(i, 1);
      }
      persist(); setSync();
    }
    S.syncErr = null;
  } catch(e) {
    console.warn("sync", e);
    if (!S.syncErr) toast("Synchronisation impossible pour l'instant : tes modifications restent sur cet appareil et repartiront automatiquement.");
    S.syncErr = e;
  }
  flushing = false; setSync();
}
async function pull(){
  if (!SB || !navigator.onLine) { setSync(); return; }
  try {
    const all = []; const step = 1000;
    for (let from = 0; ; from += step) {
      const { data, error } = await SB.from("records").select("id,kind,data,updated_at").order("id").range(from, from + step - 1);
      if (error) throw error;
      all.push(...data); if (data.length < step) break;
    }
    const rec = {};
    all.forEach(r => rec[r.id] = { kind:r.kind, data:r.data, updated_at:r.updated_at });
    for (const o of S.outbox) { if (o.op === "upsert") rec[o.id] = { kind:o.kind, data:o.data, updated_at:o.updated_at }; else delete rec[o.id]; }
    S.rec = rec; rebuild(); persist(); dataChanged(); S.syncErr = null;
  } catch(e) { console.warn("pull", e); S.syncErr = e; }
  setSync();
}
function subscribe(){
  if (S.channel) SB.removeChannel(S.channel);
  S.channel = SB.channel("records-" + S.uid)
    .on("postgres_changes", { event:"*", schema:"public", table:"records" }, p => {
      if (p.eventType === "DELETE") {
        const o = p.old || {}; if (o.user_id && o.user_id !== S.uid) return;
        if (!o.id || S.outbox.some(x => x.id === o.id)) return; delete S.rec[o.id];
      } else {
        const r = p.new || {}; if (r.user_id !== S.uid || S.outbox.some(x => x.id === r.id)) return;
        S.rec[r.id] = { kind:r.kind, data:r.data, updated_at:r.updated_at };
      }
      rebuild(); persist(); dataChanged();
    }).subscribe();
}

function compress(file, max=2200, q=.88){
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("encodage")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("image illisible")); }; img.src = u;
  });
}
async function uploadBlob(blob){
  const path = S.uid + "/" + uid("i") + ".jpg";
  const { error } = await SB.storage.from("captures").upload(path, blob, { contentType: blob.type || "image/jpeg", cacheControl:"31536000", upsert:false });
  if (error) throw error;
  S.localUrl[path] = URL.createObjectURL(blob);
  return { path };
}
async function uploadImages(files){
  const out = [];
  if (!navigator.onLine) { toast("Pas de connexion : les captures ne peuvent pas être envoyées hors ligne."); return out; }
  for (const f of files) {
    if (!f || !/^image\//.test(f.type)) continue;
    try {
      const blob = await compress(f);
      const path = S.uid + "/" + uid("i") + ".jpg";
      const { error } = await SB.storage.from("captures").upload(path, blob, { contentType:"image/jpeg", cacheControl:"31536000", upsert:false });
      if (error) throw error;
      S.localUrl[path] = URL.createObjectURL(blob);
      out.push({ path });
    } catch(e) { console.warn(e); toast("Échec de l'envoi de " + (f.name || "la capture") + "."); }
  }
  return out;
}

function periodStart(p){
  const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (p==="7") return isoD(new Date(t - 6*864e5));
  if (p==="30") return isoD(new Date(t - 29*864e5));
  if (p==="week") { const k=(t.getDay()+6)%7; return isoD(new Date(t - k*864e5)); }
  if (p==="month") return isoD(new Date(t.getFullYear(), t.getMonth(), 1));
  if (p==="year") return isoD(new Date(t.getFullYear(), 0, 1));
  return "";
}
function applyFilter(list){
  const f = S.filter, from = periodStart(f.period);
  return list.filter(t => (!from || t.date >= from) && (!f.account || t.account===f.account) && (!f.instrument || t.instrument===f.instrument) && (!f.type || typeOf(t)===f.type));

const sysApplies = t => SYS.types.includes(typeOf(t));
const isMicroSym = s => /^(MES|MNQ|MGC|MYM|M2K|MCL|MBT|M6A|M6B|M6E|MJY|MNG|MSI|MHG)$/.test(String(s||""));
function sysCheck(t, list){
  if (!sysApplies(t)) return null;
  const v = [];
  const sym = t.instrument;
  if (!isMicroSym(sym)) v.push("std"); else if (!SYS.allowed.includes(sym)) v.push("ins");
  if (sym === "MES" && t.side === "short") v.push("mesShort");
  if (t.date && parseD(t.date).getDay() === 5) v.push("fri");
  if ((t.tags||[]).includes(REN) || (t.mistakes||[]).includes(REN)) v.push("ren");
  if ((t.tags||[]).some(x => SYS.badNews.some(n => x === "News : "+n))) v.push("news");
  const day = (list || allTrades()).filter(x => x.date === t.date && x.account === t.account && x.id !== t.id && sysApplies(x));
  const before = day.filter(x => (x.entryTime||"") < (t.entryTime||"") || ((x.entryTime||"") === (t.entryTime||"") && x.id < t.id));
  if (before.length >= SYS.maxTrades) v.push("max");
  const cumBefore = before.filter(x => (x.exitTime||x.entryTime||"") <= (t.entryTime||"")).reduce((a,x)=>a+C(x).net,0);
  if (cumBefore <= SYS.dayStop) v.push("stop");
  const c = calc(t); if (c.risk > SYS.risk * 1.1) v.push("risk");
  return v;
}

  const i = instr(ins); const d = Math.abs(num(entry) - num(stop));
  if (!i || !isFinite(d) || !d) return null;
  return { dist: d, perC: d * Number(i.pv), n: Math.floor(SYS.risk / (d * Number(i.pv))) };

function groupStats(list, keyFn){
  const g = {};
  list.forEach(t => { const k = keyFn(t); (g[k] || (g[k]=[])).push(t); });

}

  const wd = [0,0,0,0,0,0,0]; list.forEach(t => { wd[(parseD(t.date).getDay()+6)%7] += C(t).net; });

function hexA(c, a){ c = c.replace("#",""); if (c.length===3) c = c.split("").map(x=>x+x).join(""); const n = parseInt(c,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

/* ============ Calendrier : couleurs par compte, tous les mois ============ */
const ACC_PALETTE = ["#F5C518","#22D3EE","#F472B6","#FB923C","#A78BFA","#60A5FA","#E879F9","#2DD4BF","#FDBA74","#818CF8","#FDE047","#38BDF8","#C084FC","#F9A8D4","#5EEAD4","#FCD34D"];
const DEMO_PALETTE = ["#94A3B8","#CBD5E1","#64748B"];
function accOrder(demo){
  const first = {};
  for (const t of allTrades()) if (t.account && (typeOf(t)==="Démo") === demo && (!first[t.account] || t.date < first[t.account])) first[t.account] = t.date;
  return Object.keys(first).sort((a,b) => first[a].localeCompare(first[b]) || a.localeCompare(b));
}
function accColor(name){
  const custom = (S.settings.accountColors||{})[name]; if (custom) return custom;
  const t0 = allTrades().find(t => t.account === name); const demo = t0 ? typeOf(t0)==="Démo" : false;
  const i = accOrder(demo).indexOf(name); const pal = demo ? DEMO_PALETTE : ACC_PALETTE;
  return pal[(i<0?0:i) % pal.length];
}
function calList(){ const f = S.filter; return allTrades().filter(t => (!f.account || t.account===f.account) && (!f.instrument || t.instrument===f.instrument) && (!f.type || typeOf(t)===f.type)); }
function tradedMonths(list){ return [...new Set(list.map(t => t.date.slice(0,7)))].sort(); }
function accSummary(list){
  const m = {};
  for (const t of list) { const a = t.account||"—"; (m[a] = m[a] || { name:a, type:typeOf(t), n:0, net:0, from:t.date, to:t.date }); const x = m[a]; x.n++; x.net += C(t).net; if (t.date < x.from) x.from = t.date; if (t.date > x.to) x.to = t.date; }
  return Object.values(m).sort((a,b) => a.from.localeCompare(b.from));
}
function accLegend(list){
  const acc = accSummary(list); if (!acc.length) return "";
  return `<div class="card" style="margin-top:14px"><div class="card-head"><h2>Comptes</h2><span class="muted" style="font-size:12.5px">clique une pastille pour changer sa couleur · clique un nom pour filtrer</span></div>
  <div class="acc-legend">${acc.map(a => `<div class="acc-row"><label class="acc-sw" style="background:${accColor(a.name)}" title="Changer la couleur"><input type="color" class="acc-color" data-acc="${esc(a.name)}" value="${accColor(a.name)}" aria-label="Couleur du compte ${esc(a.name)}"></label>
    <button class="acc-name" data-act="cal-acc" data-k="${esc(a.name)}">${esc(a.name)}</button>${tyChip(a.type)}
    <span class="muted acc-dates">${fmtDate(a.from)} → ${fmtDate(a.to)} · ${a.n} trades</span><b class="num ${cls(a.net)}">${money(a.net)}</b></div>`).join("")}</div></div>`;
}
function dayAccounts(trades){
  const m = {}; for (const t of trades) { const a = t.account||"—"; m[a] = (m[a]||0) + 1; }
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function vCalendar(){
  const all = calList();
  const months = tradedMonths(all);
  if (!S.calInit && months.length) { const last = months[months.length-1]; S.calMonth = new Date(Number(last.slice(0,4)), Number(last.slice(5,7))-1, 1); S.calInit = true; }
  if (S.calView === "all") return vCalAll(all, months);
  const m = S.calMonth; const y = m.getFullYear(), mo = m.getMonth();
  const key = `${y}-${String(mo+1).padStart(2,"0")}`;
  const list = all.filter(t => t.date.slice(0,7) === key);
  const s = stats(list); const byDay = {}; s.days.forEach(d=>byDay[d.date]=d);
  const tByDay = {}; list.forEach(t => (tByDay[t.date] = tByDay[t.date] || []).push(t));
  const first = new Date(y, mo, 1); const start = new Date(y, mo, 1 - ((first.getDay()+6)%7));
  const today = todayISO();
  let cells = JOURS.map(j=>`<div class="hd">${j}</div>`).join("") + `<div class="hd wk">Semaine</div>`;
  let d = new Date(start); let w = 0;
  while (true) {
    let wk = { pnl:0, n:0, days:0 };
    for (let i=0;i<7;i++) {
      const iso = isoD(d), inM = d.getMonth()===mo, dd = inM ? byDay[iso] : null, j = S.days[iso];
      if (dd) { wk.pnl += dd.pnl; wk.n += dd.n; wk.days++; }
      const k = dd ? (dd.pnl>0?"win":dd.pnl<0?"loss":"") : "";
      const accs = dd ? dayAccounts(tByDay[iso]||[]) : [];
      const stripe = accs.length ? `style="border:2px solid ${accColor(accs[0])}"` : "";
      cells += `<button class="cday ${inM?"":"out"} ${k} ${iso===today?"today":""}" ${stripe} data-act="day" data-d="${iso}" aria-label="${fmtDateLong(iso)}${accs.length?" · "+esc(accs.join(", ")):""}">
        <span class="dn">${d.getDate()}</span>
        ${dd ? `<span class="p ${cls(dd.pnl)}">${moneyK(dd.pnl)}</span><span class="m">${dd.n} trade${dd.n>1?"s":""} · ${pct(dd.w/(dd.w+dd.l||1))}</span>` : ""}
        <span class="ic">${j && (j.premarket||j.review) ? "✎ journal" : ""}</span></button>`;
      d.setDate(d.getDate()+1);
    }
    w++;
    cells += `<div class="cweek wk"><small>Semaine ${w}</small><b class="${cls(wk.pnl)}">${wk.n?money(wk.pnl):"—"}</b><small>${wk.days} jour${wk.days>1?"s":""} · ${wk.n} trades</small></div>`;
    if (d.getMonth() !== mo || d.getFullYear() !== y) break;
  }
  const idx = months.indexOf(key);
  const prevM = idx > 0 ? months[idx-1] : months.filter(x => x < key).pop();
  const nextM = idx >= 0 && idx < months.length-1 ? months[idx+1] : months.find(x => x > key);
  const mLabel = k => { const [yy,mm] = k.split("-"); return MOIS[Number(mm)-1] + " " + yy; };
  return `
  <div class="page-head"><div><h1>Calendrier</h1><p>${MOIS[mo]} ${y} · <span class="num ${cls(s.net)}">${money(s.net)}</span> · ${s.days.length} jour${s.days.length>1?"s":""} tradé${s.days.length>1?"s":""} · ${s.greenDays} verts</p></div>
    <div class="cal-nav">
      <div class="seg" role="group" aria-label="Vue"><button class="on" data-act="calview" data-k="month">Mois</button><button data-act="calview" data-k="all">Tous les mois</button></div>
      <div class="cal-step"><button class="btn" data-act="calgo" data-k="${prevM||""}" ${prevM?"":"disabled"} aria-label="Mois tradé précédent">‹</button>
      <select id="cal-pick" aria-label="Choisir un mois">${months.slice().reverse().map(k=>`<option value="${k}" ${k===key?"selected":""}>${mLabel(k)}</option>`).join("")}${months.includes(key)?"":`<option selected>${MOIS[mo]} ${y}</option>`}</select>
      <button class="btn" data-act="calgo" data-k="${nextM||""}" ${nextM?"":"disabled"} aria-label="Mois tradé suivant">›</button></div>
    </div></div>
  ${demoBanner()}${filterBar()}
  <div class="cal">${cells}</div>
  <p class="muted" style="margin-top:10px">Fond vert ou rouge = jour gagnant ou perdant. Bordure de couleur = le compte tradé ce jour-là (voir la légende). Clique sur un jour pour ouvrir ses trades et son journal.</p>
  ${accLegend(list)}`;
}
function vCalAll(all, months){
  const byMonth = {}; all.forEach(t => (byMonth[t.date.slice(0,7)] = byMonth[t.date.slice(0,7)] || []).push(t));
  let cum = 0;
  const cards = months.map(k => {
    const L = byMonth[k]; const s = stats(L); cum += s.net;
    const [yy,mm] = k.split("-").map(Number);
    const byDay = {}; s.days.forEach(d=>byDay[d.date]=d);
    const tByDay = {}; L.forEach(t => (tByDay[t.date] = tByDay[t.date] || []).push(t));
    const first = new Date(yy, mm-1, 1); const off = (first.getDay()+6)%7; const nd = new Date(yy, mm, 0).getDate();
    let g = JOURS.map(j=>`<span class="mh">${j[0]}</span>`).join("") + Array(off).fill('<span></span>').join("");
    for (let day=1; day<=nd; day++) {
      const iso = `${k}-${String(day).padStart(2,"0")}`; const dd = byDay[iso];
      const accs = dd ? dayAccounts(tByDay[iso]) : [];
      g += `<span class="md ${dd?(dd.pnl>0?"win":dd.pnl<0?"loss":"flat"):""}" ${accs.length?`style="box-shadow:inset 0 0 0 2px ${accColor(accs[0])}"`:""} title="${dd?`${fmtDateLong(iso)} : ${money(dd.pnl)} · ${esc(accs.join(", "))}`:""}">${day}</span>`;
    }
    const accs = accSummary(L);
    return `<button class="mcard" data-act="calgo" data-k="${k}" aria-label="Ouvrir ${MOIS[mm-1]} ${yy}">
      <div class="mtop"><b>${MOIS[mm-1]} ${yy}</b><span class="num ${cls(s.net)}">${money(s.net)}</span></div>
      <div class="mgrid">${g}</div>
      <div class="macc">${accs.map(a=>`<span class="mchip"><i style="background:${accColor(a.name)}"></i>${esc(a.name.replace(/^Challenge /,"Ch. ").replace(/^Express /,"Exp. ").replace(/ \(…/," …").replace(/\)$/,""))}</span>`).join("")}</div>
      <div class="mfoot muted">${s.days.length} jours · ${s.n} trades · win ${pct(s.winRate)} · cumul <span class="num ${cls(cum)}">${moneyK(cum)}</span></div>
    </button>`;
  }).join("");
  const s = stats(all);
  return `
  <div class="page-head"><div><h1>Calendrier</h1><p>Tous les mois tradés · ${months.length} mois · <span class="num ${cls(s.net)}">${money(s.net)}</span> · ${s.days.length} jours tradés</p></div>
    <div class="cal-nav"><div class="seg" role="group" aria-label="Vue"><button data-act="calview" data-k="month">Mois</button><button class="on" data-act="calview" data-k="all">Tous les mois</button></div></div></div>
  ${demoBanner()}${filterBar()}
  ${months.length ? `<div class="mcards">${cards}</div>` : `<p class="muted">Aucun trade pour ces filtres.</p>`}
  <p class="muted" style="margin-top:10px">Vert = jour gagnant, rouge = jour perdant. La bordure de couleur = le compte utilisé. Clique sur un mois pour l'ouvrir.</p>
  ${accLegend(all)}`;
}

const MOODS = ["","Très mauvaise","Mauvaise","Neutre","Bonne","Excellente"];

  const tr = allTrades();
  const dates = [...new Set(tr.map(t=>t.date).concat(Object.keys(S.days)).concat([todayISO(), S.jDate]))].sort().reverse();
  const sel = S.jDate; const j = S.days[sel] || {};
  const dayTrades = tr.filter(t=>t.date===sel).sort(sortTrades);

  const listHtml = dates.slice(0,120).map(ds => { const st = stats(tr.filter(t=>t.date===ds)); const has = S.days[ds]; return `<button class="j-item ${ds===sel?"on":""}" data-act="jdate" data-d="${ds}"><span>${fmtDate(ds)}<small>${st.n?st.n+" trade"+(st.n>1?"s":""):"pas de trade"}${has?" · ✎":""}</small></span><span class="num ${cls(st.net)}">${st.n?moneyK(st.net):""}</span></button>`; }).join("");
  const imgs = j.images || [];
  return `
  <div class="page-head"><div><h1>Journal quotidien</h1><p>Prépare ta session, puis fais ta revue après la clôture.</p></div></div>

async function importJSON(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(err) { toast("Fichier illisible : choisis un fichier JSON d'Edgelog."); return; }
  const trades = (data.trades||[]).filter(t => t && t.id && t.date);
  const days = Object.entries(data.days||{});
  const setups = (data.setups||[]).filter(x => x && x.id);
  const countImgs = l => (l||[]).filter(im => im && typeof im.url === "string" && im.url.startsWith("data:")).length;
  const totalImgs = trades.reduce((n,t)=>n+countImgs(t.images),0) + days.reduce((n,[,d])=>n+countImgs(d.images),0) + setups.reduce((n,x)=>n+countImgs(x.images),0);
  if (totalImgs && !navigator.onLine) { toast("Connexion requise pour importer les captures."); return; }
  let done = 0, failed = 0;
  const prog = () => { $("#modal-root").innerHTML = `<div class="overlay"><div class="modal" style="width:min(460px,100%)"><h1>Import en cours…</h1><p class="muted">${trades.length} trades, ${days.length} journaux, ${totalImgs} captures. Garde l'app ouverte.</p><div class="bar2" style="height:10px;background:var(--panel-2)"><i style="width:${totalImgs?Math.round(done/totalImgs*100):100}%;background:var(--accent)"></i></div><p class="num">Captures envoyées : ${done} / ${totalImgs}${failed?` · ${failed} en échec`:""}</p></div></div>`; };
  prog();
  const fix = async (list, prev=[]) => { const out = []; for (const im of list||[]) { const same = im && im.name && prev.find(p => p.name === im.name && p.path); if (same) { out.push(same); done++; prog(); continue; } if (im && typeof im.url === "string" && im.url.startsWith("data:")) { try { const blob = await (await fetch(im.url)).blob(); const up = await uploadBlob(blob); if (im.name) up.name = im.name; out.push(up); } catch(e) { failed++; } done++; prog(); } else if (im) out.push(im); } return out; };
  try {
    if (data.settings) {
      const cur = clone(S.settings);
      for (const i of data.settings.instruments||[]) if (!cur.instruments.find(x => x.sym === i.sym)) cur.instruments.push(i);
      for (const k of ["accounts","tags","mistakes","emotions"]) cur[k] = [...new Set((cur[k]||[]).concat(data.settings[k]||[]))];
      put("settings", "settings", cur);
    }
    const items = [];
    for (const x of setups) { const b = clone(x); delete b.id; b.images = await fix(x.images); items.push({ kind:"setup", id:x.id, data:b }); }
    for (const [k,v] of days) { const prev = (S.days[k]||{}); const b = clone(prev); delete b.date; for (const [kk,vv] of Object.entries(v)) { if (kk === "images" || kk === "date") continue; if (vv !== "" && vv != null && (b[kk] === undefined || b[kk] === "" || b[kk] === 0)) b[kk] = vv; } const added = await fix(v.images, prev.images||[]); b.images = (prev.images||[]).filter(p => !added.includes(p)).concat(added); items.push({ kind:"day", id:k, data:b }); }
    for (const t of trades) { const b = clone(t); delete b.id; delete b.demo; const prevT = S.trades.find(x => x.id === t.id) || {}; const kept = (prevT.images||[]).filter(p => !p.name); b.images = kept.concat(await fix(t.images, prevT.images||[])); b.tags = [...new Set((b.tags||[]).concat((prevT.tags||[]).filter(x => x !== "À vérifier" && !/^News : |^Annonce macro$/.test(x))))]; for (const k of ["setup","mistakes","emotion","rating","followedPlan","notes","stop","target","checklist"]) if (prevT[k] !== undefined && prevT[k] !== "" && !(Array.isArray(prevT[k]) && !prevT[k].length) && prevT[k] !== 0 && prevT[k] !== null) b[k] = prevT[k]; items.push({ kind:"trade", id:t.id, data:b }); }
    putMany(items);
    closeModal();
    toast(`${trades.length} trades et ${days.length} journaux importés${failed?`, ${failed} captures en échec`:""}. Synchronisation en cours.`);
  } catch(err) { console.warn(err); closeModal(); toast("Import interrompu : réessaie, les éléments déjà importés ne seront pas dupliqués."); }
}

}
function gate(html){ const g = $("#gate"); g.innerHTML = html ? `<div class="gate-card">${html}</div>` : ""; g.classList.toggle("on", !!html); }
const LOGO = `<span class="brand-mark" style="width:44px;height:44px;border-radius:12px"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 17l5-6 4 3 7-9"/><path d="M15 5h5v5"/></svg></span>`;
function showSetup(err){
  gate(`${LOGO}<h1>Connecter ta base de données</h1>
    <p class="muted">Colle l'adresse et la clé publique de ton projet Supabase. Tu les trouves dans Supabase, menu <b>Project Settings → API Keys</b>. À faire une seule fois par appareil.</p>
    <form id="setup-form" class="grid" style="gap:10px">
      <label class="f" for="cfg-url"><span>Project URL</span><input type="text" id="cfg-url" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <label class="f" for="cfg-key"><span>Clé « anon » / « publishable »</span><textarea id="cfg-key" rows="3" placeholder="eyJhbGciOi… ou sb_publishable_…" autocapitalize="off" spellcheck="false" required></textarea></label>
      <p class="err">${esc(err||"")}</p>
      <button class="btn primary" type="submit">Continuer</button>
    </form>`);
  $("#setup-form").addEventListener("submit", e => {
    e.preventDefault();
    const url = $("#cfg-url").value.trim().replace(/\/+$/,""), key = $("#cfg-key").value.trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) return showSetup("L'adresse doit ressembler à https://xxxxxxxx.supabase.co");
    if (key.length < 30) return showSetup("La clé semble incomplète : copie-la en entier.");
    LS.set("tj-config", { url, key }); boot();
  });
}
const AUTH_ERR = m => /invalid login/i.test(m) ? "Email ou mot de passe incorrect." : /not confirmed/i.test(m) ? "Ton email n'est pas encore confirmé : clique sur le lien reçu par email, ou désactive la confirmation dans Supabase (voir le guide)." : /already registered|already exists/i.test(m) ? "Un compte existe déjà avec cet email : connecte-toi." : /password/i.test(m) && /6|short|least/i.test(m) ? "Le mot de passe doit faire au moins 6 caractères." : /signups? not allowed|disabled/i.test(m) ? "Les inscriptions sont fermées sur ce serveur." : /fetch|network/i.test(m) ? "Impossible de joindre le serveur : vérifie ta connexion et l'adresse du projet." : m;
function showAuth(mode="login", err="", info=""){
  gate(`${LOGO}<h1>${mode==="login"?"Connexion à Edgelog":"Créer ton compte Edgelog"}</h1>
    <p class="muted">${mode==="login"?"Utilise le même compte sur ton Mac et ton iPhone pour retrouver tes trades.":"Ce compte protège ton journal. Tu l'utiliseras sur tous tes appareils."}</p>
    <form id="auth-form" class="grid" style="gap:10px">
      <label class="f" for="au-mail"><span>Email</span><input type="email" id="au-mail" autocomplete="email" required></label>
      <label class="f" for="au-pass"><span>Mot de passe</span><input type="password" id="au-pass" autocomplete="${mode==="login"?"current-password":"new-password"}" minlength="6" required></label>
      <p class="err">${esc(err)}</p><p class="ok">${esc(info)}</p>
      <button class="btn primary" type="submit">${mode==="login"?"Se connecter":"Créer mon compte"}</button>
      <button class="btn ghost" type="button" id="au-switch">${mode==="login"?"Pas encore de compte ? Créer un compte":"J'ai déjà un compte : me connecter"}</button>
      <button class="btn ghost sm" type="button" id="au-cfg">Changer de serveur</button>
    </form>`);
  $("#au-switch").onclick = () => showAuth(mode==="login"?"signup":"login");
  $("#au-cfg").onclick = () => { LS.del("tj-config"); location.reload(); };
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#au-mail").value.trim(), password = $("#au-pass").value;
    const btn = $('#auth-form button[type="submit"]'); btn.disabled = true; btn.textContent = "Patiente…";
    try {
      if (mode === "signup") {
        const { data, error } = await SB.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.session) return showAuth("login", "", "Compte créé. Confirme ton email via le lien reçu, puis connecte-toi.");
        startApp(data.session.user);
      } else {
        const { data, error } = await SB.auth.signInWithPassword({ email, password });
        if (error) throw error;
        startApp(data.user);
      }
    } catch(er) { showAuth(mode, AUTH_ERR(er.message || String(er))); }
  });
}
async function boot(){
  const cfg = getConfig();
  if (!cfg) return showSetup();
  if (!window.supabase || !window.supabase.createClient) {
    return gate(`${LOGO}<h1>Connexion requise</h1><p class="muted">Le premier lancement a besoin d'internet pour charger l'application. Vérifie ta connexion puis relance.</p><button class="btn primary" onclick="location.reload()">Réessayer</button>`);
  }
  try { SB = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:"tj-auth" } }); }
  catch(e) { LS.del("tj-config"); return showSetup("Adresse ou clé invalide."); }
  let session = null;
  try { session = (await SB.auth.getSession()).data.session; } catch(e) {}
  if (!session) return showAuth();
  startApp(session.user);
}
function startApp(user){
  if (S.uid === user.id) return;
  S.uid = user.id; S.email = user.email;
  S.rec = LS.get("tj-cache-"+S.uid, {}); S.outbox = LS.get("tj-outbox-"+S.uid, []);
  rebuild(); gate("");
  route(); setSync();
  pull().then(flush); subscribe();
  SB.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") location.reload(); });
}
window.addEventListener("online", () => { flush().then(pull); });
window.addEventListener("offline", setSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.uid) { flush().then(pull); } });
setInterval(() => { if (S.uid && S.outbox.length) flush(); }, 30000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
